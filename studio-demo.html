<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endoume Avatar Studio · test</title>
<style>html,body{margin:0;height:100%;background:#0b0a0a;color:#f5f2ec;font-family:system-ui,sans-serif}#s{position:absolute;inset:0 0 54px 0}#b{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;gap:6px;align-items:center;padding:0 10px;overflow-x:auto}button{background:#262223;color:#fff;border:1px solid #3b3536;border-radius:4px;padding:6px 10px;white-space:nowrap}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body><div id="s"></div><div id="b"></div>
<script type="module">
import { createStudio } from "./studio3d.js?v=2";
const P = [
  { peau: 6, cheveux: 0, coupe: "tresses", barbe: "non", expr: "dents", maillot: "dom", num: "10", nomDos: "JOUEUR", acc: "non" },
  { peau: 4, cheveux: 0, coupe: "afro", barbe: "bouc", expr: "serieux", maillot: "dom", num: "9", nomDos: "BUTEUR", acc: "bandeau" },
  { peau: 1, cheveux: 3, coupe: "degrade", barbe: "legere", expr: "sourire", maillot: "ext", num: "4", nomDos: "CAPITAINE", acc: "lunettes", corps: "puissante" },
  { peau: 7, cheveux: 0, coupe: "chauve", barbe: "oui", expr: "serieux", maillot: "third", num: "23", acc: "boucles" },
  { peau: 3, cheveux: 0, coupe: "nattes", expr: "dents", maillot: "gb", num: "1", nomDos: "GARDIEN", visage: "fin" },
  { peau: 5, cheveux: 6, coupe: "long", expr: "sourire", maillot: "dom", num: "7", visage: "rond", corps: "fine" },
  { peau: 2, cheveux: 0, coupe: "flattop", expr: "serieux", maillot: "dom", num: "8" },
  { peau: 0, cheveux: 4, coupe: "boucle", expr: "sourire", maillot: "dom", num: "11", formeYeux: "rond", yeux: 2 },
  { peau: 5, cheveux: 7, coupe: "crete", expr: "dents", maillot: "dom", num: "17", barbe: "moustache" }
];
const eng = createStudio(document.getElementById("s"), P[0], { crestUrl: "assets/endoume-logo.png" });
window.eng = eng;
const b = document.getElementById("b");
P.forEach((p, i) => { const x = document.createElement("button"); x.textContent = "Exemple " + (i + 1); x.onclick = () => eng.set(p); b.append(x); });
const r = document.createElement("button"); r.textContent = "Recentrer"; r.onclick = () => eng.reset(); b.append(r);
const a = document.createElement("button"); a.textContent = "Rotation"; let on = false; a.onclick = () => eng.autoRotate(on = !on); b.append(a);
</script></body></html>
