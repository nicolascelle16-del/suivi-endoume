<head>

<style>
/* DA du club (Instagram @us_endoume) : noir et rouge du blason en diagonale, sable kaki pour les annonces, titres en serif condensé façon affiche, petites lignes en italique espacé. */
:root {
  --noir: #100e0f;
  --surface: #1b1819;
  --surface-2: #262223;
  --ligne: #3b3536;
  --texte: #f5f2ec;
  --muted: #aaa294;
  --rouge: #e0182d;
  --rouge-fonce: #8e0e1c;
  --or: #cdbd8f;
  --sable: #7c6f4f;
  --bon: #4fae6a;
  --display: "Oranienbaum", "Didot", "Bodoni 72", Georgia, serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--noir); color: var(--texte); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
header.top { border-bottom: 4px solid var(--rouge); background: linear-gradient(118deg, #0b0a0a 0 58%, var(--rouge) 58% 71%, #0b0a0a 71% 76%, var(--rouge) 76%); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.crest { width: 44px; height: 56px; display: block; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 27px; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; color: var(--or); font-family: var(--label); font-style: italic; font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-top: 3px; }
.role { font-family: var(--label); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--texte); background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 12px; }
.demo { background: #2a2210; border: 1px solid #5c4a1c; color: #ecd59a; border-radius: 10px; padding: 10px 14px; margin: 16px 0 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.demo button { background: transparent; border: 1px solid #8a7130; color: #ecd59a; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.demo button[aria-pressed="true"] { background: var(--or); color: #1b1505; border-color: var(--or); }
.tabs { display: flex; gap: 6px; margin: 20px 0 16px; flex-wrap: wrap; }
.tab { background: var(--surface); border: 1px solid var(--ligne); border-radius: 4px; padding: 8px 16px; font-family: var(--label); font-weight: 600; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
.tab[aria-selected="true"] { background: var(--rouge); border-color: var(--rouge); }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; font-size: 32px; line-height: 1.05; margin: 0; text-wrap: balance; }
h3 { font-family: var(--label); font-style: italic; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; font-size: 14px; color: var(--or); margin: 0 0 10px; }
.btn { background: var(--rouge); border: 0; border-radius: 4px; padding: 10px 18px; font-family: var(--label); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.btn:hover { background: #f02a3f; }
.btn.ghost { background: transparent; border: 1px solid var(--ligne); }
.btn.ghost:hover { border-color: var(--muted); }
.btn.small { padding: 6px 12px; font-size: 14px; letter-spacing: .08em; }
.btn:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 14px; }

@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.obj { border-left: 3px solid var(--or); padding: 6px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.note { font-size: 13px; color: var(--muted); }
.err { color: #ff9aa6; font-size: 14px; }

.code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; width: 100%; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }

.login-hero .s { font-family: var(--label); font-size: 13px; letter-spacing: .34em; text-transform: uppercase; margin-top: 6px; }
.login-form { max-width: 420px; margin: 0 auto 32px; border-radius: 0 0 6px 6px; border-top: 4px solid var(--rouge); }
.av-mini { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #0b0a0a; border: 1px solid var(--sable); flex: none; display: grid; place-items: center; font-family: var(--label); font-size: 13px; }
.av-ed { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: start; }
@media (max-width: 520px) { .av-ed { grid-template-columns: 1fr; justify-items: center; } }
.av-prev { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: linear-gradient(128deg, var(--rouge) 0 30%, #0b0a0a 30% 62%, var(--rouge) 62% 74%, #0b0a0a 74%); border: 2px solid var(--sable); }
.av-opts { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.av-opts .lab { font-family: var(--label); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ligne); padding: 0; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--rouge); }
.opt { font-size: 13px; background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 4px; padding: 5px 10px; color: var(--muted); }
.opt[aria-pressed="true"] { background: var(--rouge); border-color: var(--rouge); color: #fff; }
@media (prefers-reduced-motion: no-preference) { button.card, .btn, .sc { transition: background .15s, border-color .15s; } }
</style>

function badges(fid, f, eq) {

function records(f, parent) {
  const g = groupOf(f), ns = sortedNotes(f), last = ns[ns.length - 1], msgs = [];

/* ---------- championnat U19 ---------- */
function champView() {
  const c = S.champ, box = h("div", { class: "stack" });
  if (!c || !Array.isArray(c.classement)) { box.append(h("div", { class: "card" }, h("h3", {}, "Championnat"), h("p", { class: "note" }, "Le classement et le calendrier ne sont pas encore chargés."))); return box; }

  const short = t => (c.noms && c.noms[t]) || t;
  const logo = (t, sz) => { const src = (c.logos && c.logos[t]) || LOGOS[t]; return src && /^data:image\/(jpeg|png);base64,/.test(src) ? h("img", { src, alt: "", width: sz || 22, height: sz || 22, style: "border-radius:4px;vertical-align:middle;margin-right:8px;background:#fff;object-fit:contain" }) : null; };
  const team = (t, sz) => h("span", { style: "display:inline-flex;align-items:center;white-space:nowrap" }, logo(t, sz), t === ME ? h("strong", {}, short(t)) : short(t));
  const maj = c.majAt ? new Date(c.majAt).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
  const matchs = (c.matchs || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const next = matchs.find(m => !m.score);

    const dom = next.h === ME, opp = dom ? next.a : next.h, r = c.classement.find(x => x.t === opp);
    box.append(h("div", { class: "card", style: "border-color:var(--rouge)" }, h("h3", {}, "Prochain match"),
      h("div", { class: "hero-eq", style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" }, team(next.h, 40), h("span", { style: "color:var(--muted)" }, "contre"), team(next.a, 40)),
      h("p", { class: "note", style: "margin:4px 0 0" }, `J${next.j} · ${fmtLong(next.date)}${next.heure ? " à " + next.heure : ""} · ${dom ? "à domicile" : "à l'extérieur"}${r ? ` · adversaire ${r.rang}e avec ${r.pts} pts` : ""}`)));
  }
  const tb = h("tbody");
  for (const r of c.classement) tb.append(h("tr", { style: r.t === ME ? "background:rgba(208,24,47,.15)" : null },
    h("td", {}, r.rang), h("td", {}, team(r.t)), h("td", {}, h("b", {}, r.pts)), h("td", {}, r.j), h("td", {}, `${r.v}-${r.n}-${r.d}`), h("td", {}, `${r.bp}-${r.bc}`), h("td", {}, (r.bp - r.bc > 0 ? "+" : "") + (r.bp - r.bc))));
  box.append(h("div", { class: "card" }, h("h3", {}, `${c.titre || "Classement"}`),
    h("div", { class: "tablebox" }, h("table", { class: "stats" }, h("thead", {}, h("tr", {}, ["#", "Équipe", "Pts", "J", "V-N-D", "Buts", "Diff"].map(x => h("th", {}, x)))), tb)),
    h("p", { class: "note" }, `Classement FFF au ${maj}, sous réserve des procédures en cours.${c.remarque ? " " + c.remarque : ""}`)));
  const tb2 = h("tbody");
  for (const m of matchs) {
    const dom = m.h === ME, opp = dom ? m.a : m.h;
    let res = "";
    if (m.score) { const [x, y] = dom ? m.score : [m.score[1], m.score[0]]; res = (x > y ? "V " : x < y ? "D " : "N ") + x + "-" + y + (m.forfait ? " (forfait)" : ""); }
    tb2.append(h("tr", { style: next && m === next ? "background:rgba(214,172,78,.12)" : null }, h("td", {}, "J" + m.j), h("td", {}, fmtDate(m.date)), h("td", {}, dom ? "Dom." : "Ext."), h("td", {}, team(opp)),
      h("td", { style: res.startsWith("V") ? "color:#9fe0b1;font-weight:600" : res.startsWith("D") ? "color:#ff9aa6;font-weight:600" : null }, res || (m.heure || "–"))));
  }

  return box;
}

/* ---------- analyses de match ---------- */
function analysesCard(g, asCoach) {
  const eq = S.equipes[g] || {}, list = (Array.isArray(eq.analyses) ? eq.analyses : []).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const card = h("div", { class: "card stack" }, h("h3", { style: "margin:0" }, "Analyses de match"));
  if (asCoach) {
    const st = S.anaEdit && S.anaEdit.g === g ? S.anaEdit : { g, id: null, date: today(), titre: "", texte: "" };
    const date = h("input", { type: "date", id: "ana-d-" + g, value: st.date });
    const titre = h("input", { id: "ana-t-" + g, maxlength: "80", placeholder: "Ex. J7 · Endoume – Simiane, 2-1" }); titre.value = st.titre;
    const fields = [h("label", { class: "field" }, "Date du match", date)];
    if (g === "U19" && S.champ && Array.isArray(S.champ.matchs)) {
      const ME = S.champ.equipe, sh = t => (S.champ.noms && S.champ.noms[t]) || t;
      const ms = S.champ.matchs.slice().sort((a, b) => a.j - b.j);
      const sel = h("select", { id: "ana-m-" + g }, h("option", { value: "" }, "Choisir un match de la saison (J1 à J22)"), ms.map((m, i) => h("option", { value: String(i) }, `J${m.j} · ${sh(m.h)} – ${sh(m.a)}${m.score ? " " + m.score.join("-") : ""}`)));
      sel.onchange = () => { const m = ms[+sel.value]; if (!m) return; date.value = m.date; titre.value = `J${m.j} · ${sh(m.h)} – ${sh(m.a)}${m.score ? ", " + m.score.join("-") : ""}`; };
      fields.push(h("label", { class: "field", style: "flex:1;min-width:220px" }, "Match", sel));
    }
    const ta = h("textarea", { id: "ana-x-" + g, rows: "10", maxlength: "8000", placeholder: "Ton analyse du match : ce qui s'est passé, pourquoi, ce que tu en retiens, ce que tu changes…" }); ta.value = st.texte;
    const msg = h("span", { class: "note" });
    const save = h("button", { class: "btn small" }, st.id ? "Enregistrer les modifications" : "Publier l'analyse");
    save.onclick = async () => {
      const x = ta.value.trim(), t = titre.value.trim();
      if (!x) { msg.className = "err"; msg.textContent = "Écris l'analyse avant de l'enregistrer."; return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date.value)) { msg.className = "err"; msg.textContent = "Choisis la date du match."; return; }
      save.disabled = true;
      const item = { id: st.id || nid(), date: date.value, titre: t.slice(0, 80) || `Match du ${fmtDate(date.value)}`, texte: x.slice(0, 8000), at: new Date().toISOString() };
      const next = [...(eq.analyses || []).filter(a => a.id !== item.id), item];
      try { await writeEquipe(g, { analyses: next }); S.anaEdit = null; render(); }
      catch (e) { save.disabled = false; msg.className = "err"; msg.textContent = "Échec de l'enregistrement : réessaie."; }
    };
    const cancel = st.id ? h("button", { class: "btn ghost small", onclick: () => { S.anaEdit = null; render(); } }, "Annuler") : null;
    card.append(h("div", { class: "row" }, fields), h("label", { class: "field" }, "Titre", titre), h("label", { class: "field" }, "Analyse", ta), h("div", { class: "row" }, save, cancel, msg),
      h("p", { class: "note", style: "margin:0" }, "Les joueurs du groupe peuvent lire les analyses publiées."));
  }
  if (!list.length) card.append(h("p", { class: "note", style: "margin:0" }, "Aucune analyse publiée pour l'instant."));
  for (const a of list) {
    const item = h("div", { class: "hitem" }, h("div", { class: "hhead" }, h("strong", {}, a.titre || "Match"), h("span", { class: "pill" }, fmtLong(a.date))),
      h("div", { class: "com-text", style: "white-space:pre-wrap" }, a.texte || ""));
    if (asCoach) {
      const del = h("button", { class: "linkbtn danger" }, "Supprimer");
      del.onclick = async () => {
        if (del.dataset.c !== "1") { del.dataset.c = "1"; del.textContent = "Confirmer la suppression"; return; }
        try { await writeEquipe(g, { analyses: (eq.analyses || []).filter(x => x.id !== a.id) }); render(); } catch (e) { del.textContent = "Échec : réessaie"; }
      };
      item.append(h("div", { class: "row" }, h("button", { class: "linkbtn", onclick: () => { S.anaEdit = { g, id: a.id, date: a.date, titre: a.titre || "", texte: a.texte || "" }; render(); window.scrollTo({ top: 0 }); } }, "Modifier"), del));
    }
    card.append(item);
  }
  return card;
}

function watchBulletins(vid) {

    h("button", { class: "subtab", role: "tab", "aria-selected": String(S.psub === "equipe"), onclick: () => { S.psub = "equipe"; render(); } }, "L'équipe"));

/* ---------- rendu ---------- */
function render() {
  const app = document.getElementById("app"); app.textContent = "";
  const role = document.getElementById("role");
  role.textContent = S.admin ? "Espace coach" : "Mon espace";
  app.append(S.admin ? coachView() : joueurView());
}

/* ---------- exemples pour l'aperçu ---------- */
function demoData() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const mk = (nom, groupe, extra) => {
    const G = GROUPS[groupe], notes = [];
    const base = 2.4 + rnd() * 1.2;
    for (let i = 0; i < 9; i++) {
      const d = new Date(2026, 8, 8 + i * 7 + (i % 2 ? 3 : 0)).toISOString().slice(0, 10);
      const crit = {}; for (const [k] of G.crit) crit[k] = Math.max(1, Math.min(5, Math.round(base + i * 0.12 + (rnd() - 0.5) * 1.6)));
      notes.push({ id: "ex" + i + nom, date: d, type: i % 3 === 2 ? "Match" : "Entraînement", crit, com: i === 8 ? (groupe === "U10" ? "Très appliqué aujourd'hui, il a osé demander le ballon." : "Bonne séance, continue à parler avec tes partenaires.") : "" });
    }
    const presences = notes.filter(n => n.type === "Entraînement").map(n => ({ date: n.date, type: n.type, p: true }));
    for (let i = 0; i < 6; i++) presences.push({ date: new Date(2026, 9, 1 + i * 3).toISOString().slice(0, 10), type: "Entraînement", p: rnd() > 0.15 });
    return { nom, groupe, notes, presences, defis: groupe === "U19" ? [{ titre: "30 jongles pied faible", date: "2026-10-21" }] : [], mot: groupe === "U10" ? "Bravo pour ton courage cette semaine !" : "Continue à guider tes partenaires, ça se voit.", objectif: groupe === "U10" ? "Lever la tête avant de passer." : "Être disponible plus tôt pour le porteur.", exemple: true, ...extra };
  };
  return {
    ex1: mk("Joueur exemple A", "U19", { poste: "Milieu axial" }), ex2: mk("Joueur exemple B", "U19", { poste: "Défenseur central" }), ex3: mk("Joueur exemple C", "U19", { poste: "Ailier" }),
    ex4: mk("Enfant exemple A", "U10"), ex5: mk("Enfant exemple B", "U10"),
    ex6: mk("Gardien exemple A", "GB", { sousCat: "U16" }), ex7: mk("Gardien exemple B", "GB", { sousCat: "U14" })
  };
}

function demoEquipes() {
  return {
    U19: { objectif: "6 séquences de plus de 4 passes par match", defi: { titre: "30 jongles pied faible", detail: "Sans que le ballon touche le sol, devant le coach." },
      hommes: [{ date: "2026-10-18", fid: "ex2", nom: "Joueur exemple B" }, { date: "2026-11-01", fid: "ex1", nom: "Joueur exemple A" }], mois: { fid: "ex3", nom: "Joueur exemple C", label: "octobre 2026" },
      stats: [{ date: "2026-10-18", adv: "Exemple FC", passes: 4, recup: 31, bm: 2, be: 1 }, { date: "2026-11-01", adv: "Exemple AS", passes: 7, recup: 36, bm: 3, be: 0 }] },
    U10: { objectif: "Écarter le jeu pour créer des espaces", defi: { titre: "Conduite slalom", detail: "Passer les 6 plots sans en toucher un." }, hommes: [{ date: "2026-10-17", fid: "ex4", nom: "Enfant exemple A" }], stats: [] },
    GB: { objectif: "Relancer à la main vers un joueur libre", hommes: [], stats: [] }
  };
}

/* ---------- démarrage ---------- */
document.getElementById("logout").onclick = async () => { await signOut(auth); location.reload(); };
let started = false;
onAuthStateChanged(auth, async u => {
  if (!u) { if (started) location.reload(); document.getElementById("logout").hidden = true; loginView(); return; }
  if (started) { if (u.uid !== S.me) location.reload(); return; }
  started = true;
  document.getElementById("logout").hidden = false;
  const db = DB; S.db = db; S.me = u.uid; S.email = u.email || "";
  if (S.pendingSignup) {
    const ps = S.pendingSignup; S.pendingSignup = null;
    try { const ins = { nom: ps.nom, email: u.email || "", at: new Date().toISOString() }; if (ps.groupe) ins.groupe = ps.groupe; if (ps.poste) ins.poste = ps.poste; await setDoc(fsDoc(fs, "inscriptions/" + u.uid), ins); } catch (e) {}
    try { await saveAvatar(u.uid, ps.avatar); } catch (e) {}
  }
  try { S.admin = (await getDoc(fsDoc(fs, "coachs/" + u.uid))).exists(); } catch (e) { S.admin = false; }
  const slowT = setTimeout(() => { S.slow = true; render(); }, 10000);
  render();
  const watchVotes = () => db.collection("votes").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.votes = n; softRender(); }, () => {});
  if (S.admin) {
    db.collection("fiches").onSnapshot(snap => {
      clearTimeout(slowT); S.slow = false;
      const next = {}; snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      S.fiches = next; S.loaded = true;
      if (S.view === "saisie" || S.view === "ajout") return;
      if (S.view === "fiche" && !S.fiches[S.sel]) { S.view = "list"; S.sel = null; }
      softRender();
    }, err => { clearTimeout(slowT); S.loaded = true; render(); document.getElementById("app").append(h("p", { class: "err" }, "Impossible de lire les fiches pour l'instant.")); });
    db.collection("inscriptions").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.inscriptions = n; softRender(); }, () => {});
    db.collection("objectifs").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.objectifs = n; softRender(); }, () => {});
    db.collection("avatars").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.avatars = n; softRender(); }, () => {});
    db.collection("coachs").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.coachs = n; softRender(); }, () => {});
    db.doc("championnat/u19").onSnapshot(cs => { S.champ = cs.exists ? cs.data() : null; softRender(); }, () => {});
    db.collection("equipe").onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); }); S.equipes = next; softRender(); }, () => {});
    watchVotes();
    db.collection("seances").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.seances = n; softRender(); }, () => {});
  } else {
    try { S.blocked = (await getDoc(fsDoc(fs, "bloques/" + u.uid))).exists(); } catch (e) { S.blocked = false; }
    if (S.blocked) { clearTimeout(slowT); render(); return; }
    try { const ins = await getDoc(fsDoc(fs, "inscriptions/" + u.uid)); S.myInscription = ins.exists() ? ins.data() : null; } catch (e) {}
    db.doc("objectifs/" + S.me).onSnapshot(os => { if (os.exists) S.objectifs[S.me] = os.data(); softRender(); }, () => {});
    db.collection("avatars").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.avatars = n; softRender(); }, () => {});
    db.doc("fiches/" + S.me).onSnapshot(snap => {
      clearTimeout(slowT); S.slow = false;
      S.myFiche = snap.exists ? snap.data() : null;
      if (S.myFiche && !S.eqSub) {
        const g = groupOf(S.myFiche);
        S.eqSub = db.doc("equipe/" + g).onSnapshot(es => { if (es.exists) S.equipes[g] = es.data(); else delete S.equipes[g]; softRender(); }, () => {});
        if (g === "U19") db.doc("championnat/u19").onSnapshot(cs => { S.champ = cs.exists ? cs.data() : null; softRender(); }, () => {});
        watchVotes();
      }
      softRender();
    }, err => { clearTimeout(slowT); S.myFiche = null; render(); });
  }
});
</script>
