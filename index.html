<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi joueurs US Endoume</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Barlow+Condensed:ital,wght@0,500;0,600;1,500;1,600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* DA du club (Instagram @us_endoume) : noir et rouge du blason en diagonale, sable kaki pour les annonces, titres en serif condensé façon affiche, petites lignes en italique espacé. */
:root {
  --noir: #100e0f;
  --surface: #1b1819;
  --surface-2: #262223;
  --ligne: #3b3536;
  --texte: #f5f2ec;
  --muted: #aaa294;
  --rouge: #e0182d;
  --rouge-fonce: #8e0e1c;
  --or: #cdbd8f;
  --sable: #7c6f4f;
  --bon: #4fae6a;
  --display: "Oranienbaum", "Didot", "Bodoni 72", Georgia, serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--noir); color: var(--texte); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
header.top { border-bottom: 4px solid var(--rouge); background: linear-gradient(118deg, #0b0a0a 0 58%, var(--rouge) 58% 71%, #0b0a0a 71% 76%, var(--rouge) 76%); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.crest { width: 44px; height: 57px; display: block; border-radius: 5px 5px 50% 50% / 5px 5px 34% 34%; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 27px; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; color: var(--or); font-family: var(--label); font-style: italic; font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-top: 3px; }
.role { font-family: var(--label); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--texte); background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 12px; }
.demo { background: #2a2210; border: 1px solid #5c4a1c; color: #ecd59a; border-radius: 10px; padding: 10px 14px; margin: 16px 0 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.demo button { background: transparent; border: 1px solid #8a7130; color: #ecd59a; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.demo button[aria-pressed="true"] { background: var(--or); color: #1b1505; border-color: var(--or); }
.tabs { display: flex; gap: 6px; margin: 20px 0 16px; flex-wrap: wrap; }
.tab { background: var(--surface); border: 1px solid var(--ligne); border-radius: 4px; padding: 8px 16px; font-family: var(--label); font-weight: 600; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
.tab[aria-selected="true"] { background: var(--rouge); border-color: var(--rouge); }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; font-size: 32px; line-height: 1.05; margin: 0; text-wrap: balance; }
h3 { font-family: var(--label); font-style: italic; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; font-size: 14px; color: var(--or); margin: 0 0 10px; }
.btn { background: var(--rouge); border: 0; border-radius: 4px; padding: 10px 18px; font-family: var(--label); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.btn:hover { background: #f02a3f; }
.btn.ghost { background: transparent; border: 1px solid var(--ligne); }
.btn.ghost:hover { border-color: var(--muted); }
.btn.small { padding: 6px 12px; font-size: 14px; letter-spacing: .08em; }
.btn:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 14px; }
button.card { text-align: left; width: 100%; display: flex; flex-direction: column; gap: 8px; }
button.card:hover { border-color: var(--rouge); }
.pname { font-weight: 600; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pmeta { color: var(--muted); font-size: 13px; }
.avg { font-family: var(--display); font-size: 30px; color: var(--or); font-variant-numeric: tabular-nums; }
.avg small { font-family: var(--body); font-size: 14px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--ligne); color: var(--muted); }
.pill.match { border-color: var(--rouge); color: #ff9aa6; }
.pill.ex { border-color: var(--sable); color: var(--or); }
.empty { color: var(--muted); padding: 24px; border: 1px dashed var(--ligne); border-radius: 12px; text-align: center; }
.crit-row { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--ligne); }
.crit-row:first-of-type { border-top: 0; }
.scale { display: flex; gap: 4px; }
.sc { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--surface-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc[aria-pressed="true"] { background: var(--rouge); color: #fff; border-color: var(--rouge); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 8px; padding: 9px 10px; color: var(--texte); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.saisie-p { display: flex; flex-direction: column; gap: 6px; }
.saisie-p.absent .crits, .saisie-p.absent .com { display: none; }
.saisie-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.toggle { font-size: 13px; background: transparent; border: 1px solid var(--ligne); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
.toggle[aria-pressed="true"] { border-color: var(--bon); color: #9fe0b1; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barline { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 52px; gap: 10px; align-items: center; font-size: 14px; }
.track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: #e0182d; border-radius: 999px; }
.fill.m { background: #b08c40; }
.val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { width: 100%; min-width: 420px; height: auto; display: block; }
.hist { display: flex; flex-direction: column; gap: 10px; }
.hitem { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.hitem .hhead { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 2px 8px; }
.chip b { color: var(--or); font-variant-numeric: tabular-nums; }
.com-text { font-size: 15px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.obj { border-left: 3px solid var(--or); padding: 6px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.note { font-size: 13px; color: var(--muted); }
.err { color: #ff9aa6; font-size: 14px; }
.ok { color: #9fe0b1; font-size: 14px; }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; width: 100%; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }
.danger { color: #ff9aa6; }
.subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--ligne); margin: -4px 0 16px; }
.subtab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; color: var(--muted); font-family: var(--label); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; }
.subtab[aria-selected="true"] { color: var(--texte); border-bottom-color: var(--rouge); }
.top-fiche { display: grid; grid-template-columns: 240px 1fr; gap: 12px; align-items: start; }
@media (max-width: 620px) { .top-fiche { grid-template-columns: 1fr; } .fcard { margin: 0 auto; } }
.fcard { width: 240px; aspect-ratio: 5 / 7; border-radius: 14px; position: relative; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(128deg, var(--rouge) 0 27%, #0b0a0a 27% 55%, var(--rouge) 55% 69%, #0b0a0a 69%); border: 2px solid var(--sable); border-radius: 8px 8px 46% 46% / 8px 8px 16% 16%; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding-bottom: 26px; }
.fcard .fc-top { display: flex; justify-content: space-between; align-items: flex-start; }
.fcard .fc-note { font-family: var(--display); font-size: 52px; line-height: .85; color: #fff; font-variant-numeric: tabular-nums; }
.fcard .fc-note small { display: block; font-family: var(--label); font-style: italic; font-size: 12px; letter-spacing: .18em; color: var(--texte); }
.fcard .fc-ini { width: 92px; height: 92px; border-radius: 50%; background: #0b0a0a; border: 2px solid var(--sable); display: grid; place-items: center; font-family: var(--display); font-size: 30px; overflow: hidden; }
.fcard .fc-ini svg, .av-mini svg, .av-prev svg { width: 100%; height: 100%; display: block; }
.fcard .fc-nom { font-family: var(--display); font-size: 27px; text-transform: uppercase; letter-spacing: .01em; text-align: center; margin-top: auto; text-wrap: balance; line-height: 1.1; }
.fcard .fc-poste { text-align: center; font-family: var(--label); font-style: italic; font-size: 13px; color: var(--or); letter-spacing: .16em; text-transform: uppercase; }
.fcard .fc-crit { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 13px; background: rgba(0,0,0,.55); border-radius: 8px; padding: 8px 10px; }
.fcard .fc-crit span b { color: var(--or); font-variant-numeric: tabular-nums; margin-right: 4px; }
.fcard .fc-club { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); font-family: var(--label); font-size: 10px; letter-spacing: .3em; color: var(--or); white-space: nowrap; }
.stars { color: var(--or); letter-spacing: 1px; }
.stars .off { color: #4a4650; }
.record { background: linear-gradient(90deg, rgba(124,111,79,.45), transparent); border: 1px solid var(--sable); border-radius: 6px; padding: 10px 12px; font-weight: 600; }
.mot { border-left: 3px solid var(--rouge); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 15px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bdg { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 10px; padding: 8px; }
.bdg .ico { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--label); font-weight: 600; font-size: 15px; background: var(--rouge); color: #fff; }
.bdg.off { opacity: .45; }
.bdg.off .ico { background: #3a3640; color: var(--muted); }
.bdg b { display: block; font-size: 14px; }
.bdg small { color: var(--muted); font-size: 12px; line-height: 1.25; display: block; }
table.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--ligne); }
table.stats th { color: var(--muted); font-weight: 500; font-size: 13px; }
.tablebox { overflow-x: auto; }
.hero-eq { font-size: 18px; font-weight: 600; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 6px; padding: 10px 12px; }
.stat-l { font-family: var(--label); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat-v { font-family: var(--display); font-size: 34px; line-height: 1.05; color: var(--texte); font-variant-numeric: tabular-nums; }
.stat-s { font-size: 12px; color: var(--muted); }
.tip { position: absolute; z-index: 5; pointer-events: none; background: #0b0a0a; border: 1px solid var(--ligne); border-radius: 6px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.tip[hidden] { display: none; }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.tip em { color: var(--muted); font-style: normal; }
table.pres td { white-space: nowrap; }
table.pres td.c, table.pres th.c { text-align: center; padding: 7px 4px; }
table.pres td.pr { color: #9fe0b1; } table.pres td.ab { color: #ff9aa6; font-weight: 600; } table.pres td.nr { color: #5d5658; }
table.pres tr.clickable { cursor: pointer; } table.pres tr.clickable:hover td { background: var(--surface-2); }
.pitch { position: relative; width: 100%; max-width: 440px; aspect-ratio: 68 / 100; background: linear-gradient(180deg, #16231a, #101a13); border: 1px solid var(--ligne); border-radius: 6px; }
.pitch > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tok { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; text-align: center; }
.tok .av-mini { width: 38px; height: 38px; border: 2px solid var(--rouge); }
.tok.me .av-mini { border-color: #fff; box-shadow: 0 0 0 2px var(--rouge); }
.tok .tn { font-size: 12px; font-weight: 600; line-height: 1.1; background: rgba(0,0,0,.65); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
.tok .tp { font-family: var(--label); font-size: 10px; letter-spacing: .12em; color: var(--or); }
.compo-wrap { display: grid; grid-template-columns: minmax(0, 440px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 680px) { .compo-wrap { grid-template-columns: 1fr; } .tok { width: 70px; } .tok .tn { font-size: 11px; } }
.compo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.lab-s { font-family: var(--label); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.me-row { font-weight: 700; color: #fff; }
.kicker { font-family: var(--label); font-style: italic; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; color: var(--or); }
.login-hero { max-width: 420px; margin: 28px auto 0; background: var(--sable); border-radius: 6px 6px 0 0; padding: 22px 18px 18px; text-align: center; color: #fff; position: relative; overflow: hidden; }

.login-hero .s { font-family: var(--label); font-size: 13px; letter-spacing: .34em; text-transform: uppercase; margin-top: 6px; }
.login-form { max-width: 420px; margin: 0 auto 32px; border-radius: 0 0 6px 6px; border-top: 4px solid var(--rouge); }
.av-mini { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #0b0a0a; border: 1px solid var(--sable); flex: none; display: grid; place-items: center; font-family: var(--label); font-size: 13px; }
.av-ed { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: start; }

.av-opts .lab { font-family: var(--label); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ligne); padding: 0; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--rouge); }
.opt { font-size: 13px; background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 4px; padding: 5px 10px; color: var(--muted); }
.opt[aria-pressed="true"] { background: var(--rouge); border-color: var(--rouge); color: #fff; }

function avatarEditor(start, onChange) {
  let a = avClean(start);
  const prev = h("div", { class: "av-prev", role: "img", "aria-label": "Aperçu de l'avatar" });
  const opts = h("div", { class: "av-opts" });
  const draw = () => { prev.innerHTML = avatarSVG(a); onChange && onChange(a); paint(); };
  const groups = [];
  const swatch = (key, label, colors) => {
    const row = h("div", { class: "row", style: "gap:6px;align-items:center" });
    colors.forEach((c, i) => row.append(h("button", { type: "button", class: "sw", style: `background:${c}`, "aria-label": `${label} ${i + 1}`, "data-k": key, "data-v": String(i), onclick: () => { a = { ...a, [key]: i }; draw(); } })));
    opts.append(h("div", {}, h("div", { class: "lab" }, label), row)); groups.push(row);
  };
  const choice = (key, label, list) => {
    const row = h("div", { class: "row", style: "gap:6px" });
    list.forEach(([v, t]) => row.append(h("button", { type: "button", class: "opt", "data-k": key, "data-v": v, onclick: () => { a = { ...a, [key]: v }; draw(); } }, t)));
    opts.append(h("div", {}, h("div", { class: "lab" }, label), row)); groups.push(row);
  };
  const paint = () => groups.forEach(r => r.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(String(a[b.dataset.k]) === b.dataset.v))));
  swatch("peau", "Peau", AV.peau);
  choice("coupe", "Coupe", AV.coupe);
  swatch("cheveux", "Cheveux", AV.cheveux);
  choice("barbe", "Barbe", AV.barbe);
  choice("maillot", "Maillot", AV.maillot);
  choice("acc", "Accessoire", AV.acc);

  num.addEventListener("input", () => { a = { ...a, num: num.value.replace(/\D/g, "").slice(0, 2) }; prev.innerHTML = avatarSVG(a); onChange && onChange(a); });
  opts.append(h("label", { class: "field" }, h("span", { class: "lab", style: "margin:0" }, "Numéro"), num));
  draw();
  return h("div", { class: "av-ed" }, prev, opts);
}

function fcard(f, parent, fid) {
  const g = groupOf(f), G = GROUPS[g], ns = sortedNotes(f).slice(-5);
  const o = overall(f, 5);
  const card = h("div", { class: "fcard", role: "img", "aria-label": `Carte de ${f.nom || "joueur"}` });
  card.append(h("div", { class: "fc-club" }, "ENDOUME · 1925"));
  card.append(h("div", { class: "fc-top" },
    parent ? h("div", { class: "fc-note", style: "font-size:20px;line-height:1.1" }, o == null ? "–" : LEVELS[Math.round(o)], h("small", {}, "niveau"))
           : h("div", { class: "fc-note" }, o == null ? "–" : Math.round(o * 20), h("small", {}, "NOTE")),
    avatarNode(fid, f.nom, "fc-ini")));
  card.append(h("div", { class: "fc-nom" }, f.nom || "Joueur"));
  card.append(h("div", { class: "fc-poste" }, [f.poste, f.sousCat || G.label].filter(Boolean).join(" · ")));
  const crit = h("div", { class: "fc-crit" });
  for (const [k] of G.crit) {
    const a = critAvg(ns, k);
    crit.append(parent ? h("span", {}, ABBR[k] || k, " ", stars(a)) : h("span", {}, h("b", {}, a == null ? "–" : Math.round(a * 20)), ABBR[k] || k));
  }
  card.append(crit);
  return card;
}

/* ---------- badges et records ---------- */
function badges(fid, f, eq) {
  const g = groupOf(f), ns = sortedNotes(f), avgs = ns.map(n => noteAvg(n, g)).filter(x => x != null);
  const pres = (Array.isArray(f.presences) ? f.presences : []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const last10 = pres.slice(-10);
  const out = [];
  const add = (ico, nom, desc, got) => out.push({ ico, nom, desc, got: !!got });
  add("10", "Assidu", "Présent aux 10 dernières séances", last10.length >= 10 && last10.every(p => p.p));
  add("3x", "En feu", "3 évaluations de suite à 4 ou plus", avgs.length >= 3 && avgs.slice(-3).every(v => v >= 4));
  add("5x", "Régulier", "5 évaluations de suite à 3 ou plus", avgs.length >= 5 && avgs.slice(-5).every(v => v >= 3));
  add("↑", "Record", "Ta meilleure évaluation de la saison", avgs.length >= 3 && avgs[avgs.length - 1] > Math.max(...avgs.slice(0, -1)));
  if (g === "GB") add("GB", "Le Mur", "3 matchs notés à 4 ou plus", ns.filter(n => n.type === "Match" && noteAvg(n, g) >= 4).length >= 3);
  add("20", "Pilier", "20 évaluations dans la saison", ns.length >= 20);
  const hdm = ((eq && eq.hommes) || []).filter(x => x.fid === fid).length;
  add("★", g === "U10" ? "Joueur du plateau" : "Homme du match", hdm ? `Choisi ${hdm} fois par le coach` : "Choisi par le coach après un match", hdm);
  for (const d of (Array.isArray(f.defis) ? f.defis : [])) add("D", `Défi : ${d.titre}`, `Réussi le ${fmtDate(d.date)}`, true);
  return out;
}
function records(f, parent) {
  const g = groupOf(f), ns = sortedNotes(f), last = ns[ns.length - 1], msgs = [];
  if (!last || ns.length < 3) return msgs;
  for (const [k, lab] of GROUPS[g].crit) {
    const v = last.crit && last.crit[k]; if (typeof v !== "number") continue;
    const prev = ns.slice(0, -1).map(n => n.crit && n.crit[k]).filter(x => typeof x === "number");
    if (prev.length >= 2 && v > Math.max(...prev)) msgs.push(parent ? `Son meilleur niveau en ${lab.toLowerCase()} depuis le ${fmtLong(ns[0].date)}.` : `Ta meilleure note en ${lab.toLowerCase()} depuis le ${fmtLong(ns[0].date)}.`);
  }
  return msgs;
}
function badgesBox(fid, f) {
  const box = h("div", { class: "badges" });
  const list = badges(fid, f, S.equipes[groupOf(f)]);
  list.sort((a, b) => (b.got ? 1 : 0) - (a.got ? 1 : 0));
  for (const b of list) box.append(h("div", { class: "bdg" + (b.got ? "" : " off") }, h("span", { class: "ico", "aria-hidden": "true" }, b.ico), h("div", {}, h("b", {}, b.nom), h("small", {}, b.desc))));
  return box;
}

function champView() {
  const c = S.champ, box = h("div", { class: "stack" });
  if (!c || !Array.isArray(c.classement)) { box.append(h("div", { class: "card" }, h("h3", {}, "Championnat"), h("p", { class: "note" }, "Le classement et le calendrier ne sont pas encore chargés."))); return box; }
  const ME = c.equipe || "USM ENDOUME CATALANS";

function chart(f) {
  const g = groupOf(f);
  const pts = sortedNotes(f).map(n => ({ d: n.date, t: n.type, v: noteAvg(n, g) })).filter(p => p.v != null);
  const box = h("div", { class: "chart" });
  if (pts.length < 2) { box.append(h("p", { class: "note" }, "La courbe apparaît à partir de 2 évaluations.")); return box; }
  const W = 640, H = 200, L = 34, R = 14, T = 12, B = 30;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (5 - v) * (H - T - B) / 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la note moyenne">`;
  for (let v = 1; v <= 5; v++) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2e2a2b" stroke-width="1"/><text x="${L - 10}" y="${y(v) + 4}" fill="#a39e94" font-size="12" text-anchor="end">${v}</text>`;
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  s += `<polygon points="${x(0)},${y(1)} ${line} ${x(pts.length - 1)},${y(1)}" fill="rgba(224,24,45,.14)"/>`;
  s += `<polyline points="${line}" fill="none" stroke="#e0182d" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${last ? 6 : 4}" fill="${p.t === "Match" ? "#b08c40" : "#e0182d"}" stroke="#0e0d0f" stroke-width="2"><title>${esc(fmtDate(p.d))} · ${esc(p.t)} · ${n1(p.v)}</title></circle>`;
  });
  const step = Math.max(1, Math.ceil(pts.length / 7));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) s += `<text x="${x(i)}" y="${H - 8}" fill="#a39e94" font-size="12" text-anchor="middle">${esc(fmtDate(p.d))}</text>`; });
  const lp = pts[pts.length - 1];
  s += `<text x="${Math.min(x(pts.length - 1), W - R - 4)}" y="${y(lp.v) - 12}" fill="#f2eee6" font-size="13" font-weight="600" text-anchor="end">${n1(lp.v)}</text></svg>`;
  box.innerHTML = s;
  return box;
}

  if (S.loaded && !list.length) app.append(h("div", { class: "empty" }, `Aucun joueur ${GROUPS[S.tab].label} pour l'instant. Commence par « Ajouter un joueur ».`));
  const grid = h("div", { class: "grid" });

    const all = overall(f), last = overall(f, 5), ns = sortedNotes(f);
    const trend = (all != null && last != null && ns.length >= 6) ? (last - all > 0.15 ? "En hausse" : last - all < -0.15 ? "En baisse" : "Stable") : null;
    grid.append(h("button", { class: "card", onclick: () => { S.view = "fiche"; S.sel = fid; render(); } },
      h("div", { class: "pname" }, h("span", { class: "row", style: "gap:8px;align-items:center;flex-wrap:nowrap" }, avatarNode(fid, f.nom, "av-mini"), f.nom || "Sans nom"), f.exemple ? h("span", { class: "pill ex" }, "Exemple") : (isTemp(fid) ? h("span", { class: "pill" }, "Compte non lié") : (watchAutos(fid), autoMissing(fid, f) ? h("span", { class: "pill match" }, "Auto-éval manquante") : null))),
      h("div", { class: "pmeta" }, [f.age, f.sousCat, f.poste].filter(Boolean).join(" · ") || GROUPS[groupOf(f)].label),
      h("div", { class: "row", style: "justify-content:space-between;align-items:baseline" },
        h("span", { class: "avg" }, n1(last), h("small", {}, " /5 sur les 5 dernières")),
        trend ? h("span", { class: "pill" }, trend) : null),
      h("div", { class: "pmeta" }, ns.length ? `Dernière évaluation : ${fmtDate(ns[ns.length - 1].date)} · ${ns.length} au total` : "Pas encore évalué")));
  }
  app.append(grid);
  return app;
}

function startSaisie() {
  const rows = {};
  for (const [fid, f] of Object.entries(S.fiches)) if (groupOf(f) === S.tab) rows[fid] = { present: true, crit: {}, com: "" };
  S.saisie = { date: today(), type: "Entraînement", rows, msg: "" };
  S.view = "saisie"; render();
}

function saisieView() {
  const s = S.saisie, G = GROUPS[S.tab];
  const box = h("div", { class: "stack" });
  box.append(h("div", { class: "bar" }, h("h2", {}, `Noter une séance ${G.label}`),
    h("button", { class: "btn ghost small", onclick: () => { S.view = "list"; S.saisie = null; render(); } }, "Annuler")));
  const date = h("input", { type: "date", id: "s-date", value: s.date, oninput: e => s.date = e.target.value });
  const type = h("select", { id: "s-type", onchange: e => s.type = e.target.value },
    h("option", { value: "Entraînement", selected: s.type === "Entraînement" }, "Entraînement"),
    h("option", { value: "Match", selected: s.type === "Match" }, S.tab === "U10" ? "Plateau / match" : "Match"));
  box.append(h("div", { class: "card row" }, h("label", { class: "field" }, "Date", date), h("label", { class: "field" }, "Type", type),
    h("p", { class: "note", style: "margin:0;flex:1;min-width:200px" }, "Touche une note de 1 à 5 par critère. Les joueurs marqués absents ne sont pas enregistrés.")));
  const ids = Object.keys(s.rows).sort((a, b) => (S.fiches[a].nom || "").localeCompare(S.fiches[b].nom || "", "fr"));
  for (const fid of ids) {
    const r = s.rows[fid], f = S.fiches[fid];
    const card = h("div", { class: "card saisie-p" + (r.present ? "" : " absent") });
    const tog = h("button", { class: "toggle", "aria-pressed": String(r.present) }, r.present ? "Présent" : "Absent");
    tog.onclick = () => { r.present = !r.present; tog.setAttribute("aria-pressed", String(r.present)); tog.textContent = r.present ? "Présent" : "Absent"; card.classList.toggle("absent", !r.present); };
    card.append(h("div", { class: "saisie-head" }, h("strong", {}, f.nom || "Sans nom"), tog));
    const crits = h("div", { class: "crits" });
    for (const [k, lab] of G.crit) {
      const sc = h("div", { class: "scale", role: "group", "aria-label": lab });
      for (let v = 1; v <= 5; v++) {
        const b = h("button", { class: "sc", "aria-pressed": String(r.crit[k] === v), title: LEVELS[v] }, v);
        b.onclick = () => {
          if (r.crit[k] === v) delete r.crit[k]; else r.crit[k] = v;
          sc.querySelectorAll(".sc").forEach((x, i) => x.setAttribute("aria-pressed", String(r.crit[k] === i + 1)));
        };
        sc.append(b);
      }
      crits.append(h("div", { class: "crit-row" }, h("span", {}, lab), sc));
    }
    const com = h("input", { class: "com", type: "text", maxlength: "500", id: "com-" + fid, placeholder: G.parent ? "Un mot pour les parents (facultatif)" : "Commentaire (facultatif)", oninput: e => r.com = e.target.value });
    com.value = r.com;
    card.append(crits, h("label", { class: "field com" }, com));
    box.append(card);
  }
  const msg = h("p", { class: "note" }, s.msg || "");
  const save = h("button", { class: "btn" }, "Enregistrer la séance");
  save.onclick = async () => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s.date)) { msg.className = "err"; msg.textContent = "Choisis une date."; return; }
    save.disabled = true; msg.className = "note"; msg.textContent = "Enregistrement…";
    let ok = 0, ko = 0;
    let rated = 0;
    for (const fid of ids) {
      const r = s.rows[fid], f = S.fiches[fid];
      const pres = (Array.isArray(f.presences) ? f.presences : []).filter(p => !(p.date === s.date && p.type === s.type));
      const patch = { presences: [...pres, { date: s.date, type: s.type, p: r.present }] };
      if (r.present && (Object.keys(r.crit).length || r.com.trim())) {
        patch.notes = [...sortedNotes(f), { id: nid(), date: s.date, type: s.type, crit: { ...r.crit }, com: r.com.trim().slice(0, 500), at: new Date().toISOString() }];
        rated++;
      }
      try { await writeFicheQuiet(fid, patch); ok++; } catch (e) { ko++; }
    }
    if (!rated && !ko) { /* présences seules */ }
    if (!ok && !ko) { save.disabled = false; msg.className = "err"; msg.textContent = "Aucun joueur dans ce groupe."; return; }
    if (ko) { save.disabled = false; msg.className = "err"; msg.textContent = `${ok} fiche${ok > 1 ? "s" : ""} enregistrée${ok > 1 ? "s" : ""}, ${ko} en échec. Réessaie pour celles-là.`; return; }
    S.flash = `Séance du ${fmtDate(s.date)} enregistrée : ${rated} joueur${rated > 1 ? "s" : ""} noté${rated > 1 ? "s" : ""}, présences à jour.`;
    S.view = "list"; S.saisie = null; render();
  };
  box.append(h("div", { class: "row" }, save, msg));
  return box;
}
async function writeFicheQuiet(fid, patch) {
  if (S.demo) { S.fiches[fid] = { ...S.fiches[fid], ...patch }; return; }
  await S.db.doc("fiches/" + fid).update(patch);
}

function ajoutView() {

    const data = { nom: n.slice(0, 60), groupe: grp.value, sousCat: grp.value === "GB" ? sous.value : "", poste: poste.value.trim().slice(0, 40), objectif: "", notes: [], createdAt: new Date().toISOString() };
    go.disabled = true;
    try {

      else { const ref = S.db.doc("fiches/" + cid); const snap = await ref.get(); if (snap.exists) throw new Error("exists"); await ref.set(data); if (c) await S.db.doc("inscriptions/" + c).delete(); }
      S.tab = grp.value; S.flash = `Fiche de ${n} créée.`; S.view = "list"; render();
    } catch (e) {

  box.append(h("div", { class: "card stack" },

    h("label", { class: "field" }, "Poste (facultatif)", poste),
    h("div", { class: "row" }, go, msg)));
  return box;
}

/* ---------- vue joueur / parent ---------- */
function joueurView() {
  const box = h("div", { style: "margin-top:20px" });
  if (S.demo && S.demoAs !== "coach") {
    const fid = Object.keys(S.fiches).find(k => groupOf(S.fiches[k]) === S.demoAs);
    if (fid) box.append(psubtabs(), S.psub === "equipe" ? equipeView(groupOf(S.fiches[fid]), false) : ficheView(fid, S.fiches[fid], false));

  }

  if (S.myFiche === undefined) { box.append(h("p", { class: "note" }, S.slow ? "Les données ne répondent pas encore. La page se mettra à jour seule." : "Chargement de ta fiche…")); return box; }

      h("p", { style: "margin:0" }, "Ton coach doit maintenant le relier à ta fiche. Dès que c'est fait, cette page affichera tes notes, tes badges et l'équipe. Tu ne verras que ta propre fiche."));
    if (!S.myInscription) {

        h("div", { class: "row" }, h("button", { class: "btn", onclick: async () => {
          const n = nomI.value.trim(); if (!n) { msg.textContent = "Indique ton prénom et ton nom."; return; }
          try { await S.db.doc("inscriptions/" + S.me).set({ nom: n.slice(0, 60), email: S.email || "", at: new Date().toISOString() }); S.myInscription = { nom: n }; render(); } catch (e) { msg.textContent = "Échec : réessaie."; }
        } }, "Envoyer au coach"), msg));
    } else card.append(h("p", { class: "note", style: "margin:0" }, `Demande envoyée au nom de ${S.myInscription.nom}.`));
    box.append(card);
    const am = h("span", { class: "note" });
    box.append(h("div", { class: "card stack", style: "margin-top:12px" }, h("h3", { style: "margin:0" }, S.avatars[S.me] ? "Ton avatar" : "Crée ton avatar"), avatarEditor(S.avDraft || S.avatars[S.me], a => { S.avDraft = a; }),
      h("div", { class: "row" }, h("button", { class: "btn small", onclick: async () => { try { await saveAvatar(S.me, S.avDraft || S.avatars[S.me]); am.textContent = "Avatar enregistré : il sera sur ta carte."; } catch (e) { am.textContent = "Échec : réessaie."; } } }, "Enregistrer"), am)));
    return box;
  }
  box.append(psubtabs(), S.psub === "equipe" ? equipeView(groupOf(S.myFiche), false) : ficheView(S.me, S.myFiche, false));
  return box;
}
function psubtabs() {
  return h("div", { class: "subtabs", role: "tablist" },
    h("button", { class: "subtab", role: "tab", "aria-selected": String(S.psub === "fiche"), onclick: () => { S.psub = "fiche"; render(); } }, "Ma fiche"),
    h("button", { class: "subtab", role: "tab", "aria-selected": String(S.psub === "equipe"), onclick: () => { S.psub = "equipe"; render(); } }, "L'équipe"));

/* ---------- rendu ---------- */
function render() {
  const app = document.getElementById("app"); app.textContent = "";

/* ---------- exemples pour l'aperçu ---------- */
function demoData() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const mk = (nom, groupe, extra) => {
    const G = GROUPS[groupe], notes = [];
    const base = 2.4 + rnd() * 1.2;
    for (let i = 0; i < 9; i++) {
      const d = new Date(2026, 8, 8 + i * 7 + (i % 2 ? 3 : 0)).toISOString().slice(0, 10);
      const crit = {}; for (const [k] of G.crit) crit[k] = Math.max(1, Math.min(5, Math.round(base + i * 0.12 + (rnd() - 0.5) * 1.6)));
      notes.push({ id: "ex" + i + nom, date: d, type: i % 3 === 2 ? "Match" : "Entraînement", crit, com: i === 8 ? (groupe === "U10" ? "Très appliqué aujourd'hui, il a osé demander le ballon." : "Bonne séance, continue à parler avec tes partenaires.") : "" });
    }
    const presences = notes.filter(n => n.type === "Entraînement").map(n => ({ date: n.date, type: n.type, p: true }));
    for (let i = 0; i < 6; i++) presences.push({ date: new Date(2026, 9, 1 + i * 3).toISOString().slice(0, 10), type: "Entraînement", p: rnd() > 0.15 });
    return { nom, groupe, notes, presences, defis: groupe === "U19" ? [{ titre: "30 jongles pied faible", date: "2026-10-21" }] : [], mot: groupe === "U10" ? "Bravo pour ton courage cette semaine !" : "Continue à guider tes partenaires, ça se voit.", objectif: groupe === "U10" ? "Lever la tête avant de passer." : "Être disponible plus tôt pour le porteur.", exemple: true, ...extra };
  };
  return {
    ex1: mk("Joueur exemple A", "U19", { poste: "Milieu axial" }), ex2: mk("Joueur exemple B", "U19", { poste: "Défenseur central" }), ex3: mk("Joueur exemple C", "U19", { poste: "Ailier" }),
    ex4: mk("Enfant exemple A", "U10"), ex5: mk("Enfant exemple B", "U10"),
    ex6: mk("Gardien exemple A", "GB", { sousCat: "U16" }), ex7: mk("Gardien exemple B", "GB", { sousCat: "U14" })
  };
}

/* ---------- démarrage ---------- */
document.getElementById("logout").onclick = async () => { await signOut(auth); location.reload(); };
let started = false;
onAuthStateChanged(auth, async u => {
  if (!u) { if (started) location.reload(); document.getElementById("logout").hidden = true; loginView(); return; }
  if (started) { if (u.uid !== S.me) location.reload(); return; }
  started = true;
  document.getElementById("logout").hidden = false;
  const db = DB; S.db = db; S.me = u.uid; S.email = u.email || "";
  if (S.pendingSignup) {
    const ps = S.pendingSignup; S.pendingSignup = null;
    try { await setDoc(fsDoc(fs, "inscriptions/" + u.uid), { nom: ps.nom, email: u.email || "", at: new Date().toISOString() }); } catch (e) {}
    try { await saveAvatar(u.uid, ps.avatar); } catch (e) {}
  }
  try { S.admin = (await getDoc(fsDoc(fs, "coachs/" + u.uid))).exists(); } catch (e) { S.admin = false; }
  const slowT = setTimeout(() => { S.slow = true; render(); }, 10000);
  render();
  const watchVotes = () => db.collection("votes").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.votes = n; softRender(); }, () => {});
  if (S.admin) {
    db.collection("fiches").onSnapshot(snap => {
      clearTimeout(slowT); S.slow = false;
      const next = {}; snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      S.fiches = next; S.loaded = true;
      if (S.view === "saisie" || S.view === "ajout") return;
      if (S.view === "fiche" && !S.fiches[S.sel]) { S.view = "list"; S.sel = null; }
      softRender();
    }, err => { clearTimeout(slowT); S.loaded = true; render(); document.getElementById("app").append(h("p", { class: "err" }, "Impossible de lire les fiches pour l'instant.")); });
    db.collection("inscriptions").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.inscriptions = n; softRender(); }, () => {});
    db.collection("objectifs").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.objectifs = n; softRender(); }, () => {});
    db.collection("avatars").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.avatars = n; softRender(); }, () => {});
    db.collection("coachs").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.coachs = n; softRender(); }, () => {});
    db.doc("championnat/u19").onSnapshot(cs => { S.champ = cs.exists ? cs.data() : null; softRender(); }, () => {});
    db.collection("equipe").onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); }); S.equipes = next; softRender(); }, () => {});
    watchVotes();
  } else {
    try { const ins = await getDoc(fsDoc(fs, "inscriptions/" + u.uid)); S.myInscription = ins.exists() ? ins.data() : null; } catch (e) {}
    db.doc("objectifs/" + S.me).onSnapshot(os => { if (os.exists) S.objectifs[S.me] = os.data(); softRender(); }, () => {});
    db.collection("avatars").onSnapshot(q => { const n = {}; q.docs.forEach(d => n[d.id] = d.data()); S.avatars = n; softRender(); }, () => {});
    db.doc("fiches/" + S.me).onSnapshot(snap => {
      clearTimeout(slowT); S.slow = false;
      S.myFiche = snap.exists ? snap.data() : null;
      if (S.myFiche && !S.eqSub) {
        const g = groupOf(S.myFiche);
        S.eqSub = db.doc("equipe/" + g).onSnapshot(es => { if (es.exists) S.equipes[g] = es.data(); else delete S.equipes[g]; softRender(); }, () => {});
        if (g === "U19") db.doc("championnat/u19").onSnapshot(cs => { S.champ = cs.exists ? cs.data() : null; softRender(); }, () => {});
        watchVotes();
      }
      softRender();
    }, err => { clearTimeout(slowT); S.myFiche = null; render(); });
  }
});
