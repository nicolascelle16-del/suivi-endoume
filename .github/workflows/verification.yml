name: Vérification du site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Playwright
        run: pip install playwright
      - name: index.html à jour, syntaxe et test de rendu
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 outils/build.py --verifier --tests
